name: Market Data Synchronization (Keyless)

on:
  schedule:
    # Run at 21:00 UTC (after US/European market close) Monday through Friday
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Keyless Market Ingestion
        run: |
          uv run --python 3.13 --with yfinance --with requests --with pandas --with numpy python3 scripts/sync_market_data.py

      - name: Commit and push updated market data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data/generated/
          if git diff --staged --quiet; then
            echo "No market data changes detected."
          else
            git commit -m "chore(data): auto-update global market indices"
            git push
          fi
