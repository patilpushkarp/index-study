<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Obsidian Canvas -->
  <rect width="64" height="64" rx="14" fill="#0b0806"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#2f2a24" stroke-width="1"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#241f1a" stroke-width="1"/>
  <line x1="12" y1="34" x2="52" y2="34" stroke="#241f1a" stroke-width="1"/>
  <line x1="12" y1="48" x2="52" y2="48" stroke="#241f1a" stroke-width="1"/>
  
  <!-- Trend Path -->
  <path d="M 14 44 L 26 36 L 36 40 L 50 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Gradient Glow under Trend Line -->
  <path d="M 14 44 L 26 36 L 36 40 L 50 18 L 50 50 L 14 50 Z" fill="url(#trendGrad)" opacity="0.15"/>
  
  <!-- Apex Signal Green Beacon -->
  <circle cx="50" cy="18" r="4.5" fill="#00e200" filter="url(#glow)"/>
  
  <defs>
    <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e200" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e200" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
